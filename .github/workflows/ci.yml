name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Sync dependencies
        # Skip lockfile (contains CUDA extras); install only base deps + dev tools for tests
        run: uv sync --no-lock

      - name: Run linting, type checking, and tests
        run: scripts/lint.sh

