name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:

jobs:
  commit-lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate conventional commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(feat|fix|docs|refactor|perf|test|chore|ci|revert|style|build)(\([a-z0-9._-]+\))?!?: .+'
          bad=0
          while IFS= read -r sha; do
            msg=$(git log -1 --format='%s' "$sha")
            # Skip merge commits and git-generated reverts.
            if [[ "$msg" =~ ^Merge\  ]] || [[ "$msg" =~ ^Revert\ \" ]]; then
              continue
            fi
            if ! [[ "$msg" =~ $pattern ]]; then
              echo "::error::Bad commit message: $msg ($sha)"
              bad=1
            fi
          done < <(git rev-list "$BASE_SHA".."$HEAD_SHA")
          if [[ "$bad" -eq 1 ]]; then
            echo ""
            echo "Expected format: type(scope): description"
            echo "Allowed types: feat fix docs refactor perf test chore ci revert style build"
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    env:
      UV_FROZEN: "1"  # Skip lockfile updates (contains CUDA deps that can't build)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Sync dependencies
        # Use --frozen to skip lockfile updates (avoids fetching CUDA git deps)
        run: uv sync --frozen

      - name: Run linting, type checking, and tests
        run: scripts/lint.sh

