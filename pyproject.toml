[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mini-mesh"
version = "0.6.0"
description = "Video to 3D mesh reconstruction pipeline"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Matthias Humt", email = "github.gizzard320@passmail.net" }]
keywords = [
    "3d-reconstruction",
    "3d-modeling",
    "colmap",
    "computer-vision",
    "gaussian-splatting",
    "mesh-generation",
    "neural-rendering",
    "nerf",
    "neus",
    "photogrammetry",
    "structure-from-motion",
    "surface-reconstruction",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = ["gradio>=4.0.0"]

[project.optional-dependencies]
# Core pipeline deps. scripts/build.sh and docker/Dockerfile prebuild the CUDA
# wheels that sdfstudio expects but cannot resolve correctly from PyPI.
core = [
    "numpy<2",
    "pillow==12.1.0",
    "scikit-build-core>=0.11",
    "pybind11>=2.6",
    "sdfstudio[cuda,export] @ git+https://github.com/hummat/sdfstudio.git@v0.9.0",
]
# Background removal
rembg = ["rembg[gpu,cli]==2.0.69"]
# NeRF/Gaussian splatting methods
nerf = [
    "nerfstudio @ git+https://github.com/hummat/nerfstudio.git@55a1f83025bb28cbf792760c9b79f9eb22c3a2e4",
]
# Gaussian splatting plugins
splat = [
    "mini-mesh[nerf]",
    "splatfacto-w @ git+https://github.com/KevinXu02/splatfacto-w.git@119a3bfb3aa03669278e174ff11c4dfdcbcf97d7",
]
# SAM2 segmentation
sam = [
    "sam2 @ git+https://github.com/hummat/sam2.git@98f488a540f87260b8e51146dc3ab15694dd174c",
]
# VGGSfM for visual-geometry-grounded SfM
vggsfm = [
    "vggsfm @ git+https://github.com/hummat/vggsfm.git@d597df629a312a662544006ac3bdbc2782b82834",
]
# hloc-cli requires manual hloc install first:
#   git clone --recursive https://github.com/cvg/Hierarchical-Localization.git
#   pip install -e Hierarchical-Localization
#   pip install git+https://github.com/hummat/hloc-cli.git@1b714e1183bbc3cb6f4031ddedcc4bd5190ece29
# All optional deps for local install (excludes hloc; CUDA extensions are built by scripts/build.sh)
local = [
    "mini-mesh[core,rembg,splat,sam,vggsfm]",
]

[project.urls]
Homepage = "https://hummat.com"
Repository = "https://github.com/hummat/mini-mesh"
Documentation = "https://hummat.github.io/mini-mesh"
Issues = "https://github.com/hummat/mini-mesh/issues"

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.14.0",
    "pyright>=1.1.0",
]

[tool.uv]
# Limit resolution to x86_64 Linux (CUDA-only project)
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=webui",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = ["unit: Unit tests", "integration: Integration tests"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "*/test_*", ".venv/*", "venv/*"]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["webui.py"]

[tool.pyright]
include = ["webui.py", "tests"]
exclude = ["**/__pycache__", ".venv", "venv"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"
