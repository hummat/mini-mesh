[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mini-mesh"
version = "0.2.0"
description = "Video to 3D mesh reconstruction pipeline"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Matthias Humt", email = "github.gizzard320@passmail.net" }]
keywords = [
    "3d-reconstruction",
    "3d-modeling",
    "colmap",
    "computer-vision",
    "gaussian-splatting",
    "mesh-generation",
    "neural-rendering",
    "nerf",
    "neus",
    "photogrammetry",
    "structure-from-motion",
    "surface-reconstruction",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = ["gradio>=4.0.0"]

[project.urls]
Homepage = "https://hummat.com"
Repository = "https://github.com/hummat/mini-mesh"
Documentation = "https://hummat.github.io/mini-mesh"
Issues = "https://github.com/hummat/mini-mesh/issues"

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.14.0",
    "pyright>=1.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=webui",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = ["unit: Unit tests", "integration: Integration tests"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "*/test_*", ".venv/*", "venv/*"]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.hatch.build.targets.wheel]
packages = ["webui.py"]

[tool.pyright]
include = ["webui.py", "tests"]
exclude = ["**/__pycache__", ".venv", "venv"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"
